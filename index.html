cables left.","Так получится замкнутый круг.":"That would make a loop.","Таких деталей больше нет.":"No more of these parts.","У этой детали нет входа для провода.":"This part has no socket for a cable.","Шар застрял.":"The balloon is stuck.","Шар лопнул.":"The balloon popped.","Шар улетел.":"The balloon flew away.","Шарик в корзине!":"Ball in the basket!","Шарик остановился.":"The ball stopped.","Шарик улетел за край.":"The ball flew off the edge.","Шестерёнки налезают друг на друга.":"Gears overlap.","Эскалатор ставится с наклоном не круче 45°.":"The escalator can tilt 45° at most.","Эта розетка уже занята.":"That socket is taken.","Этот прибор уже подключён уровнем.":"This device is already wired by the level.","Этот прибор уже подключён — сначала сними его провод.":"This device is already wired — remove its cable first.","Цель: зажечь лампу.":"Goal: light the lamp.","Цель: шарик в корзину.":"Goal: get the ball into the basket."," Шар не должен лопнуть.":" Don't pop the balloon.","Провод: нажми на гнездо прибора, потом на гнездо розетки, кнопки или ветряка.":"Cable: click a device's socket, then a socket on the wall, a button or a generator.","Этот провод проложен уровнем — его не снять.":"This cable belongs to the level — it can't be removed.","Конец провода в руке. Воткни в другое гнездо — или нажми на пустое место, чтобы убрать провод.":"Cable end in hand. Plug it into another socket — or click empty space to put the cable away.","Провода закончились. Сними какой-нибудь провод, чтобы переложить его.":"No cables left. Remove one to reuse it.","Провод убран в запас.":"Cable put away.","Провод идёт от прибора к источнику тока: розетке, кнопке или ветряку.":"A cable runs from a device to a power source: a wall socket, a button or a generator.","Второй конец провода — в гнездо прибора: лампы, вентилятора, эскалатора, пресса или кнопки.":"The other end goes into a device: lamp, fan, escalator, press or button.","Деталь убрана.":"Part removed.","Эта деталь — часть ур
